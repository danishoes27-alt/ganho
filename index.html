<!DOCTYPE html>
<html lang="pt-BR">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');

  :root {
    --paper: #F5F3FA;
    --paper-raised: #FFFFFF;
    --ink: #211B36;
    --ink-soft: #6A6280;
    --green: #4C3FA8;
    --green-deep: #2E2470;
    --gold: #B8891F;
    --gold-soft: #F3E6C6;
    --red: #A6402F;
    --red-soft: #F3E0DB;
    --green-soft-bg: #E4E0F7;
    --line: #E1DCF0;
    --radius: 14px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #15121F;
      --paper-raised: #201B33;
      --ink: #EDEAF7;
      --ink-soft: #A79FC2;
      --green: #8B7BE8;
      --green-deep: #6957D6;
      --gold: #E0B84A;
      --gold-soft: #3A3020;
      --red: #E37B69;
      --red-soft: #3A2320;
      --green-soft-bg: #2C2650;
      --line: #332C4D;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; font-weight: 600; }

  .mono { font-family: 'JetBrains Mono', monospace; }

  /* ---------- Login ---------- */
  .login-screen {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    padding: 32px 24px;
  }
  .login-mark {
    width: 52px; height: 52px; border-radius: 12px; background: var(--green-deep);
    display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
  }
  .login-mark svg { width: 26px; height: 26px; }
  .login-screen h1 { font-size: 30px; line-height: 1.15; color: var(--green-deep); margin-bottom: 6px; }
  .login-sub { color: var(--ink-soft); font-size: 15px; margin-bottom: 28px; line-height: 1.5; }
  label { font-size: 13px; color: var(--ink-soft); font-weight: 600; display: block; margin-bottom: 6px; margin-top: 16px; }
  input {
    width: 100%; padding: 13px 14px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--paper-raised); font-size: 16px; font-family: 'Inter', sans-serif; color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--green); }
  .btn {
    margin-top: 24px; width: 100%; padding: 14px; border-radius: 10px; border: none;
    background: var(--green); color: white; font-size: 16px; font-weight: 600;
    font-family: 'Inter', sans-serif; cursor: pointer;
  }
  .btn:active { background: var(--green-deep); }
  .btn-ghost {
    background: transparent; color: var(--green-deep); border: 1.5px solid var(--line); margin-top: 10px;
  }
  .toggle-link { text-align: center; margin-top: 18px; color: var(--ink-soft); font-size: 14px; }
  .toggle-link span { color: var(--green); font-weight: 600; text-decoration: underline; }
  .err { color: var(--red); font-size: 13px; margin-top: 8px; }

  /* ---------- Header ---------- */
  .header {
    padding: 20px 20px 0; display: flex; justify-content: space-between; align-items: flex-start;
  }
  .header .greet { font-size: 13px; color: var(--ink-soft); }
  .header .name { font-size: 19px; font-family: 'Fraunces', serif; font-weight: 600; }
  .logout-btn { font-size: 13px; color: var(--ink-soft); background: none; border: none; text-decoration: underline; cursor: pointer; padding: 4px; }
  .menu-btn {
    background: none; border: none; font-size: 24px; color: var(--ink-soft); cursor: pointer; padding: 4px 10px;
    line-height: 1;
  }
  .dropdown-menu {
    position: absolute; top: 42px; right: 0; background: var(--paper-raised); border: 1.5px solid var(--line);
    border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.12); z-index: 15; min-width: 160px; overflow: hidden;
  }
  .dropdown-item { padding: 13px 16px; font-size: 14.5px; font-weight: 500; cursor: pointer; border-bottom: 1px solid var(--line); }
  .dropdown-item:last-child { border-bottom: none; }
  .dropdown-item:active { background: var(--paper); }

  .plan-card {
    margin: 16px 20px 0; background: var(--green-deep); color: white; border-radius: var(--radius);
    padding: 18px 20px; position: relative; overflow: hidden;
  }
  .plan-card .label { font-size: 12px; opacity: 0.75; margin-bottom: 4px; }
  .plan-card .days { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 600; }
  .plan-card .sub { font-size: 13px; opacity: 0.85; margin-top: 4px; }
  .plan-card.expiring { background: var(--red); }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; margin: 20px 20px 0; border-bottom: 1.5px solid var(--line); }
  .tab { flex: 1; text-align: center; padding: 10px 0; font-size: 14px; font-weight: 600; color: var(--ink-soft); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1.5px; }
  .tab.active { color: var(--green-deep); border-bottom-color: var(--green); }

  .content { flex: 1; padding: 18px 20px 100px; }

  /* ---------- Sales list ---------- */
  .summary-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .summary-box { flex: 1; background: var(--paper-raised); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; }
  .summary-box .n { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600; }
  .summary-box .l { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

  .venda-card { background: var(--paper-raised); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
  .venda-card.clickable { cursor: pointer; }
  .venda-card.clickable:active { border-color: var(--green); }
  .venda-top { display: flex; justify-content: space-between; align-items: baseline; }
  .venda-cliente { font-weight: 600; font-size: 15.5px; }
  .venda-total { font-family: 'JetBrains Mono', monospace; font-size: 15px; color: var(--green-deep); font-weight: 600; }
  .parcela-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .parcela-info { font-size: 13.5px; color: var(--ink-soft); }
  .parcela-valor { font-family: 'JetBrains Mono', monospace; font-size: 13.5px; }
  .status-pill { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
  .status-pago { background: var(--green-soft-bg); color: var(--green-deep); }
  .status-pendente { background: var(--gold-soft); color: var(--gold); }
  .status-atrasado { background: var(--red-soft); color: var(--red); }
  .parcela-row.clickable { cursor: pointer; }
  .cobrar-btn {
    display: block; width: 100%; margin: 0 0 8px; padding: 9px; border-radius: 8px; border: 1.5px solid var(--green);
    background: var(--paper-raised); color: var(--green-deep); font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer;
  }
  .cobrar-btn.cobrar-atrasado {
    border-color: var(--red); background: var(--red); color: white;
  }

  .empty { text-align: center; padding: 40px 20px; color: var(--ink-soft); }
  .empty svg { margin-bottom: 12px; opacity: 0.5; }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    width: min(440px, calc(100% - 40px)); background: var(--green); color: white; border: none;
    padding: 15px; border-radius: 12px; font-size: 15px; font-weight: 600; font-family: 'Inter', sans-serif;
    box-shadow: 0 8px 24px rgba(31,78,55,0.35); cursor: pointer;
  }

  /* ---------- Modal ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(31,42,35,0.5); display: flex; align-items: flex-end; z-index: 10; }
  .modal { background: var(--paper); width: 100%; max-width: 480px; margin: 0 auto; border-radius: 20px 20px 0 0; padding: 22px 20px 28px; max-height: 88vh; overflow-y: auto; }
  .modal h2 { font-size: 20px; margin-bottom: 4px; }
  .modal-close { position: absolute; top: 16px; right: 20px; background: none; border: none; font-size: 20px; color: var(--ink-soft); cursor: pointer; }
  .row-rel { position: relative; }
  select { width: 100%; padding: 13px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--paper-raised); font-size: 16px; font-family: 'Inter', sans-serif; color: var(--ink); }

  /* ---------- Referral tab ---------- */
  .ref-hero { background: var(--gold-soft); border-radius: var(--radius); padding: 20px; text-align: center; margin-bottom: 18px; }
  .ref-hero h2 { font-size: 20px; color: var(--green-deep); margin-bottom: 6px; }
  .ref-hero p { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 16px; line-height: 1.5; }
  .code-box { background: var(--paper-raised); border: 1.5px dashed var(--gold); border-radius: 10px; padding: 12px; font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600; letter-spacing: 2px; color: var(--green-deep); margin-bottom: 12px; }
  .share-btn { background: var(--green-deep); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; font-family: 'Inter', sans-serif; font-size: 14px; cursor: pointer; }
  .ref-list-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .ref-list-item .nm { font-weight: 600; }
  .ref-list-item .bonus { color: var(--green-deep); font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #241E3D; color: white; padding: 10px 18px; border-radius: 30px; font-size: 13.5px; z-index: 20; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ========= CONEXÃO COM O SUPABASE =========
// Troque pelos valores do SEU projeto (Project Settings → API no painel do Supabase)
const SUPABASE_URL = 'https://fzmchuuhrrajzhwezrrq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_HUKsTdBhQd-472_-g2HCJQ_nCJ3pkeB';
const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let state = {
  screen: 'onboarding', // onboarding | login | app
  onboardingStep: 0,
  showMenu: false,
  loginMode: 'entrar', // entrar | criar
  user: null,
  tab: 'vendas',
  vendas: [],
  despesas: [],
  referrals: [],
  showNovaVenda: false,
  showNovaDespesa: false,
  vendaDetalheId: null,
  showVendaMenu: false,
  showEditarVenda: false,
  confirmExcluirVenda: false,
  editVendaForm: { cliente: '', valor: '', parcelas: '1', dataVenda: '', whatsapp: '', descricao: '', categoria: 'Venda' },
  editVendaErr: '',
  adminUsuarios: [],
  adminBusca: '',
  adminCarregando: false,
  adminErro: '',
  assinandoCarregando: false,
  assinarErro: '',
  toast: null,
  form: { nome: '', telefone: '', codigoIndicacao: '', pin: '' },
  vendaForm: { cliente: '', valor: '', parcelas: 'avista', dataVenda: '', whatsapp: '', descricao: '', categoria: 'Venda' },
  vendaFiltro: 'todos',
  despesaForm: { descricao: '', valor: '' },
  vendaErr: '',
  despesaErr: '',
  err: ''
};

function render() {
  App();
  document.body.onclick = () => {
    let changed = false;
    if (state.showMenu) { state.showMenu = false; changed = true; }
    if (state.showVendaMenu) { state.showVendaMenu = false; changed = true; }
    if (changed) App();
  };
}



function normPhone(p) { return p.replace(/\D/g, ''); }

function todayISO() {
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}

function fmtMoney(v) {
  return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR');
}

function daysBetween(a, b) {
  return Math.ceil((b - a) / (1000 * 60 * 60 * 24));
}

function showToast(msg) {
  state.toast = msg;
  render();
  setTimeout(() => { state.toast = null; render(); }, 2200);
}

// ---------- Banco de dados (Supabase) ----------
async function findUserByCode(code) {
  const { data, error } = await sbClient.rpc('validar_codigo_indicacao', { codigo_busca: code });
  if (error || !data || data.length === 0) return null;
  return data[0]; // { user_id, nome }
}

async function genCodeUnico() {
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  for (let tentativa = 0; tentativa < 10; tentativa++) {
    let c = '';
    for (let i = 0; i < 6; i++) c += chars[Math.floor(Math.random() * chars.length)];
    const jaExiste = await findUserByCode(c);
    if (!jaExiste) return c;
  }
  return 'X' + Date.now().toString(36).toUpperCase().slice(-5);
}

async function loadVendas(userId) {
  const { data, error } = await sbClient.from('vendas').select('*').eq('user_id', userId).order('criado_em', { ascending: false });
  if (error) { console.error(error); return []; }
  return data.map(v => ({ id: v.id, cliente: v.cliente, valor_total: Number(v.valor_total), categoria: v.categoria, descricao: v.descricao, whatsapp: v.whatsapp, criado_em: v.criado_em, parcelas: v.parcelas }));
}

async function insertVenda(venda) {
  const { error } = await sbClient.from('vendas').insert({ ...venda, user_id: state.user.user_id });
  if (error) { console.error(error); showToast('Não deu pra salvar a venda. Confere sua internet e tenta de novo.'); }
}

async function updateVenda(venda) {
  const { error } = await sbClient.from('vendas').update({
    cliente: venda.cliente, valor_total: venda.valor_total, categoria: venda.categoria,
    descricao: venda.descricao, whatsapp: venda.whatsapp, criado_em: venda.criado_em, parcelas: venda.parcelas
  }).eq('id', venda.id);
  if (error) { console.error(error); showToast('Não deu pra salvar a alteração. Confere sua internet.'); }
}

async function deleteVendaDB(vendaId) {
  const { error } = await sbClient.from('vendas').delete().eq('id', vendaId);
  if (error) { console.error(error); showToast('Não deu pra excluir. Confere sua internet.'); }
}

async function loadDespesas(userId) {
  const { data, error } = await sbClient.from('despesas').select('*').eq('user_id', userId).order('criado_em', { ascending: false });
  if (error) { console.error(error); return []; }
  return data.map(d => ({ id: d.id, descricao: d.descricao, valor: Number(d.valor), criado_em: d.criado_em }));
}

async function insertDespesa(despesa) {
  const { error } = await sbClient.from('despesas').insert({ ...despesa, user_id: state.user.user_id });
  if (error) { console.error(error); showToast('Não deu pra salvar o gasto. Confere sua internet.'); }
}

async function deleteDespesaDB(despesaId) {
  const { error } = await sbClient.from('despesas').delete().eq('id', despesaId);
  if (error) { console.error(error); showToast('Não deu pra excluir. Confere sua internet.'); }
}

async function loadReferrals(userId) {
  const { data, error } = await sbClient.from('referrals').select('*').eq('referrer_user_id', userId).order('data', { ascending: false });
  if (error) { console.error(error); return []; }
  return data.map(r => ({ nome: r.nome, data: r.data, bonus_dias: r.bonus_dias }));
}


// ---------- Actions ----------
function authEmail(telefone) {
  return telefone + '@ganho.app.internal';
}

async function handleCriarConta() {
  state.err = '';
  const nome = state.form.nome.trim();
  const telefone = normPhone(state.form.telefone);
  const pin = state.form.pin.trim();
  const codigoIndicacao = state.form.codigoIndicacao.trim().toUpperCase();

  if (!nome || telefone.length < 10) {
    state.err = 'Preenche seu nome e um telefone válido com DDD.';
    render();
    return;
  }
  if (!/^\d{6}$/.test(pin)) {
    state.err = 'A senha precisa ter exatamente 6 números.';
    render();
    return;
  }

  state.loading = true;
  render();

  try {
    let referrer = null;
    if (codigoIndicacao) {
      referrer = await findUserByCode(codigoIndicacao);
      if (!referrer) {
        state.err = 'Código de indicação não encontrado. Confere e tenta de novo, ou deixa em branco.';
        state.loading = false;
        render();
        return;
      }
    }

    const { data: signUpData, error: signUpError } = await sbClient.auth.signUp({
      email: authEmail(telefone), password: pin
    });
    if (signUpError) {
      state.err = signUpError.message.includes('already registered')
        ? 'Já existe conta com esse telefone. Toca em "Entrar".'
        : 'Não deu pra criar a conta: ' + signUpError.message;
      state.loading = false;
      render();
      return;
    }

    const userId = signUpData.user.id;
    const code = await genCodeUnico();
    const now = new Date().toISOString();
    const novoUsuario = {
      user_id: userId, code, nome, telefone,
      plano_dias_base: 3, plano_dias_bonus: 0,
      indicado_por: referrer ? codigoIndicacao : null,
      criado_em: now
    };
    const { error: insertError } = await sbClient.from('usuarios').insert(novoUsuario);
    if (insertError) {
      state.err = 'Conta criada, mas houve um erro salvando o perfil: ' + insertError.message;
      state.loading = false;
      render();
      return;
    }

    // O bônus de indicação agora só é creditado quando a pessoa indicada
    // efetua o primeiro pagamento de verdade (via admin_renovar_assinatura),
    // não mais no momento do cadastro.

    state.user = novoUsuario;
    state.vendas = [];
    state.despesas = [];
    state.referrals = [];
    state.screen = 'app';
    state.tab = 'vendas';
    state.loading = false;
    render();
  } catch (e) {
    state.loading = false;
    state.err = 'Não deu pra criar a conta agora. Detalhe: ' + (e && e.message ? e.message : String(e));
    render();
  }
}

async function handleEntrar() {
  state.err = '';
  const telefone = normPhone(state.form.telefone);
  const pin = state.form.pin.trim();
  if (telefone.length < 10) {
    state.err = 'Digita o telefone completo com DDD.';
    render();
    return;
  }
  if (!/^\d{6}$/.test(pin)) {
    state.err = 'Digita sua senha de 6 números.';
    render();
    return;
  }

  state.loading = true;
  render();

  try {
    const { data: signInData, error: signInError } = await sbClient.auth.signInWithPassword({
      email: authEmail(telefone), password: pin
    });
    if (signInError) {
      state.err = 'Telefone ou senha incorretos.';
      state.loading = false;
      render();
      return;
    }

    const userId = signInData.user.id;
    const { data: perfil, error: perfilError } = await sbClient.from('usuarios').select('*').eq('user_id', userId).single();
    if (perfilError || !perfil) {
      state.err = 'Não achei seu perfil. Fala com o suporte.';
      state.loading = false;
      render();
      return;
    }

    state.user = perfil;
    state.vendas = await loadVendas(userId);
    state.despesas = await loadDespesas(userId);
    state.referrals = await loadReferrals(userId);
    state.screen = 'app';
    state.tab = 'vendas';
    state.loading = false;
    render();
  } catch (e) {
    state.loading = false;
    state.err = 'Não deu pra entrar agora. Detalhe: ' + (e && e.message ? e.message : String(e));
    render();
  }
}

async function handleLogout() {
  await sbClient.auth.signOut();
  state.user = null;
  state.vendas = [];
  state.despesas = [];
  state.referrals = [];
  state.vendaDetalheId = null;
  state.adminUsuarios = [];
  state.adminBusca = '';
  state.form = { nome: '', telefone: '', codigoIndicacao: '', pin: '' };
  state.screen = 'login';
  state.loginMode = 'entrar';
  render();
}

function gerarParcelas(valor, formaPagamento, dataVenda) {
  if (formaPagamento === 'avista') {
    return [{ numero: 1, valor: valor, vencimento: dataVenda.toISOString(), status: 'pago' }];
  }
  const numParcelas = parseInt(formaPagamento, 10) || 1;
  const valorParcela = Math.round((valor / numParcelas) * 100) / 100;
  const parcelas = [];
  let somaParcelas = 0;
  for (let i = 1; i <= numParcelas; i++) {
    const venc = new Date(dataVenda);
    venc.setMonth(venc.getMonth() + i);
    let v = valorParcela;
    if (i === numParcelas) v = Math.round((valor - somaParcelas) * 100) / 100;
    somaParcelas += v;
    parcelas.push({ numero: i, valor: v, vencimento: venc.toISOString(), status: 'pendente' });
  }
  return parcelas;
}

async function handleNovaVenda() {
  state.vendaErr = '';
  const cliente = state.vendaForm.cliente.trim();
  const valor = parseFloat(state.vendaForm.valor.replace(',', '.'));

  if (!cliente) { state.vendaErr = 'Preenche o nome do cliente.'; render(); return; }
  if (!valor || valor <= 0) { state.vendaErr = 'Preenche um valor válido, ex: 500,00.'; render(); return; }

  const dataVendaStr = state.vendaForm.dataVenda || todayISO();
  const dataVenda = new Date(dataVendaStr + 'T12:00:00');
  const parcelas = gerarParcelas(valor, state.vendaForm.parcelas, dataVenda);

  const venda = {
    id: 'v_' + Date.now(),
    cliente, valor_total: valor,
    categoria: state.vendaForm.categoria || 'Venda',
    descricao: state.vendaForm.descricao.trim(),
    whatsapp: normPhone(state.vendaForm.whatsapp || ''),
    criado_em: dataVenda.toISOString(),
    parcelas
  };
  state.vendas.unshift(venda);
  await insertVenda(venda);
  state.vendaForm = { cliente: '', valor: '', parcelas: 'avista', dataVenda: '', whatsapp: '', descricao: '', categoria: 'Venda' };
  state.showNovaVenda = false;
  render();
}

async function handleNovaDespesa() {
  state.despesaErr = '';
  const descricao = state.despesaForm.descricao.trim();
  const valor = parseFloat(state.despesaForm.valor.replace(',', '.'));

  if (!descricao) { state.despesaErr = 'Preenche a descrição do gasto.'; render(); return; }
  if (!valor || valor <= 0) { state.despesaErr = 'Preenche um valor válido, ex: 50,00.'; render(); return; }

  const despesa = {
    id: 'd_' + Date.now(),
    descricao, valor,
    criado_em: new Date().toISOString()
  };
  state.despesas.unshift(despesa);
  await insertDespesa(despesa);
  state.despesaForm = { descricao: '', valor: '' };
  state.showNovaDespesa = false;
  render();
}

async function removeDespesa(id) {
  state.despesas = state.despesas.filter(d => d.id !== id);
  await deleteDespesaDB(id);
  render();
}

async function togglePagamento(vendaId, numero) {
  const venda = state.vendas.find(v => v.id === vendaId);
  if (!venda) return;
  const parcela = venda.parcelas.find(p => p.numero === numero);
  parcela.status = parcela.status === 'pago' ? 'pendente' : 'pago';
  await updateVenda(venda);
  render();
}

function shareCode() {
  const code = state.user.code;
  const text = `Uso esse app pra controlar minhas vendas e parcelas de um jeito automático. Usa meu código ${code} pra ganhar vantagem no cadastro: `;
  if (navigator.share) {
    navigator.share({ text }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(text);
    showToast('Texto copiado! Cola no WhatsApp.');
  }
}

// ---------- Computed ----------
function planoStatus(user) {
  const criado = new Date(user.criado_em);
  const totalDias = (user.plano_dias_base || 30) + (user.plano_dias_bonus || 0);
  const vencimento = new Date(criado);
  vencimento.setDate(vencimento.getDate() + totalDias);
  const restam = daysBetween(new Date(), vencimento);
  return { restam, vencimento };
}

function parcelaStatusReal(p) {
  if (p.status === 'pago') return 'pago';
  const venc = new Date(p.vencimento);
  const vencDia = new Date(venc.getFullYear(), venc.getMonth(), venc.getDate());
  const hoje = new Date();
  const hojeDia = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  if (vencDia < hojeDia) return 'atrasado';
  return 'pendente';
}

// ---------- Render ----------
function App() {
  const root = document.getElementById('app');
  if (state.screen === 'onboarding') { root.innerHTML = ''; root.appendChild(OnboardingScreen()); return; }
  if (state.screen === 'login') { root.innerHTML = ''; root.appendChild(LoginScreen()); return; }
  root.innerHTML = '';
  root.appendChild(AppScreen());
}

function OnboardingScreen() {
  const wrap = el('div', { class: 'login-screen', style: 'justify-content:space-between;' });
  const slide = ONBOARDING_SLIDES[state.onboardingStep];

  const top = el('div', { style: 'flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;' });
  top.appendChild(el('h1', { style: 'font-size:26px; margin-bottom:24px;' }, slide.title));
  top.appendChild(el('div', { html: slide.icon, style: 'margin-bottom:24px;' }));
  top.appendChild(el('p', { style: 'color:var(--ink-soft); font-size:15px; line-height:1.5; max-width:280px;' }, slide.subtitle));
  wrap.appendChild(top);

  const bottom = el('div');
  const dots = el('div', { style: 'display:flex; justify-content:center; gap:6px; margin-bottom:20px;' });
  ONBOARDING_SLIDES.forEach((_, i) => {
    dots.appendChild(el('div', { style: `width:7px; height:7px; border-radius:50%; background:${i === state.onboardingStep ? 'var(--green)' : 'var(--line)'};` }));
  });
  bottom.appendChild(dots);

  const isLast = state.onboardingStep === ONBOARDING_SLIDES.length - 1;
  const nextBtn = el('button', { class: 'btn' }, isLast ? 'Começar' : 'Próximo');
  nextBtn.addEventListener('click', () => {
    if (isLast) { state.screen = 'login'; render(); }
    else { state.onboardingStep++; render(); }
  });
  bottom.appendChild(nextBtn);
  wrap.appendChild(bottom);

  return wrap;
}

function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if (k === 'html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (typeof c === 'string') e.appendChild(document.createTextNode(c));
    else if (c) e.appendChild(c);
  });
  return e;
}

  if (nomeLbl) {

  const btn = el('button', { class: 'btn' }, state.loading ? 'Aguenta aí...' : (nomeLbl ? 'Criar minha conta' : 'Entrar'));
  if (state.loading) btn.setAttribute('disabled', 'true');
  btn.addEventListener('click', () => nomeLbl ? handleCriarConta() : handleEntrar());
  form.appendChild(btn);

  const toggle = el('div', { class: 'toggle-link' });

    toggle.appendChild(document.createTextNode('Já tem conta? '));

  } else {
    toggle.appendChild(document.createTextNode('Ainda não tem conta? '));

    span.addEventListener('click', () => { state.loginMode = 'criar'; state.err = ''; render(); });
    toggle.appendChild(span);
  }
  form.appendChild(toggle);

  wrap.appendChild(form);
  return wrap;
}

function AppScreen() {
  const wrap = el('div', {});

  // Header
  const header = el('div', { class: 'header', style: 'position:relative; align-items:center;' });
  const greetBox = el('div');
  greetBox.appendChild(el('div', { class: 'greet' }, 'Olá,'));
  greetBox.appendChild(el('div', { class: 'name' }, state.user.nome.split(' ')[0]));
  header.appendChild(greetBox);

  const menuBtn = el('button', { class: 'menu-btn' }, '⋮');
  menuBtn.addEventListener('click', (e) => { e.stopPropagation(); state.showMenu = !state.showMenu; render(); });
  header.appendChild(menuBtn);

  if (state.showMenu) {
    const menu = el('div', { class: 'dropdown-menu' });
    const itemAssinatura = el('div', { class: 'dropdown-item' }, 'Assinatura');
    itemAssinatura.addEventListener('click', () => { state.tab = 'assinatura'; state.showMenu = false; state.vendaDetalheId = null; render(); });
    menu.appendChild(itemAssinatura);
    if (state.user.is_admin) {
      const itemAdmin = el('div', { class: 'dropdown-item' }, 'Painel Admin');
      itemAdmin.addEventListener('click', () => { state.tab = 'admin'; state.showMenu = false; state.vendaDetalheId = null; carregarPainelAdmin(); render(); });
      menu.appendChild(itemAdmin);
    }
    const itemSair = el('div', { class: 'dropdown-item', style: 'color:var(--red);' }, 'Sair');
    itemSair.addEventListener('click', handleLogout);
    menu.appendChild(itemSair);
    header.appendChild(menu);
  }
  wrap.appendChild(header);

  if (state.tab === 'admin' && !state.user.is_admin) { state.tab = 'vendas'; }

  if (state.tab === 'admin') {
    const content = el('div', { class: 'content' });
    content.appendChild(AdminTab());
    wrap.appendChild(content);
    if (state.toast) wrap.appendChild(el('div', { class: 'toast' }, state.toast));
    return wrap;
  }

  if (state.tab === 'assinatura') {
    const content = el('div', { class: 'content' });
    content.appendChild(AssinaturaTab());
    wrap.appendChild(content);
    if (state.toast) wrap.appendChild(el('div', { class: 'toast' }, state.toast));
    return wrap;
  }

  // Tabs
  const tabs = el('div', { class: 'tabs' });
  const tabVendas = el('div', { class: 'tab' + (state.tab === 'vendas' ? ' active' : '') }, 'Vendas');
  tabVendas.addEventListener('click', () => { state.tab = 'vendas'; state.vendaDetalheId = null; render(); });
  const tabFinanceiro = el('div', { class: 'tab' + (state.tab === 'financeiro' ? ' active' : '') }, 'Financeiro');
  tabFinanceiro.addEventListener('click', () => { state.tab = 'financeiro'; state.vendaDetalheId = null; render(); });
  const tabIndique = el('div', { class: 'tab' + (state.tab === 'indique' ? ' active' : '') }, 'Indique e Ganhe');
  tabIndique.addEventListener('click', () => { state.tab = 'indique'; state.vendaDetalheId = null; render(); });
  tabs.appendChild(tabVendas);
  tabs.appendChild(tabFinanceiro);
  tabs.appendChild(tabIndique);
  wrap.appendChild(tabs);

  const content = el('div', { class: 'content' });
  if (state.tab === 'vendas') content.appendChild(VendasTab());
  else if (state.tab === 'financeiro') content.appendChild(FinanceiroTab());
  else content.appendChild(IndiqueTab());
  wrap.appendChild(content);

  if (state.tab === 'vendas' && !state.vendaDetalheId) {
    const fab = el('button', { class: 'fab' }, '+ Nova venda');
    fab.addEventListener('click', () => { state.showNovaVenda = true; render(); });
    wrap.appendChild(fab);
  } else if (state.tab === 'financeiro') {
    const fab = el('button', { class: 'fab' }, '+ Novo gasto');
    fab.addEventListener('click', () => { state.showNovaDespesa = true; render(); });
    wrap.appendChild(fab);
  }

  if (state.showNovaVenda) wrap.appendChild(NovaVendaModal());
  if (state.showNovaDespesa) wrap.appendChild(NovaDespesaModal());
  if (state.toast) wrap.appendChild(el('div', { class: 'toast' }, state.toast));

  return wrap;
}

function compartilharPendencias() {
  const linhas = [];
  state.vendas.forEach(venda => {
    venda.parcelas.forEach(p => {
      const st = parcelaStatusReal(p);
      if (st !== 'pago') {
        const marcador = st === 'atrasado' ? '⚠️' : '•';
        linhas.push(`${marcador} ${venda.cliente} — parcela ${p.numero}/${venda.parcelas.length} — ${fmtMoney(p.valor)} — vence ${fmtDate(p.vencimento)}${st === 'atrasado' ? ' (ATRASADA)' : ''}`);
      }
    });
  });
  if (linhas.length === 0) {
    showToast('Nenhuma pendência pra compartilhar. Tudo em dia!');
    return;
  }
  const msg = `📋 Pendências — ${state.user.nome}\n\n${linhas.join('\n')}`;
  const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

function enviarComprovante(venda, parcela) {
  const itemTxt = venda.descricao ? ` referente a ${venda.descricao}` : '';
  const msg = `✅ Comprovante de pagamento\n\nCliente: ${venda.cliente}\nParcela: ${parcela.numero}/${venda.parcelas.length}${itemTxt}\nValor pago: ${fmtMoney(parcela.valor)}\nData: ${fmtDate(new Date().toISOString())}\n\nObrigado pela confiança!`;
  let url;
  if (venda.whatsapp) {
    let numero = venda.whatsapp;
    if (numero.length <= 11) numero = '55' + numero;
    url = `https://wa.me/${numero}?text=${encodeURIComponent(msg)}`;
  } else {
    url = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
  }
  window.open(url, '_blank');
}

function cobrarWhatsapp(venda, parcela) {
  if (!venda.whatsapp) {
    showToast('Esse cliente não tem WhatsApp cadastrado nessa venda.');
    return;
  }
  const st = parcelaStatusReal(parcela);
  let numero = venda.whatsapp;
  if (numero.length <= 11) numero = '55' + numero; // adiciona código do Brasil se faltar

  let msg;
  const itemTxt = venda.descricao ? ` (${venda.descricao})` : '';
  if (st === 'atrasado') {
    const diasAtraso = daysBetween(new Date(parcela.vencimento), new Date());
    msg = `Oi ${venda.cliente}, tudo bem? Passando pra lembrar que a parcela ${parcela.numero}/${venda.parcelas.length}${itemTxt} de ${fmtMoney(parcela.valor)} venceu no dia ${fmtDate(parcela.vencimento)} (há ${diasAtraso} dia${diasAtraso === 1 ? '' : 's'}) e ainda tá em aberto. Pode verificar pra mim?`;
  } else {
    msg = `Oi ${venda.cliente}, tudo bem? Só um lembrete: a parcela ${parcela.numero}/${venda.parcelas.length}${itemTxt} de ${fmtMoney(parcela.valor)} vence dia ${fmtDate(parcela.vencimento)}.`;
  }
  const url = `https://wa.me/${numero}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

async function carregarPainelAdmin() {
  state.adminCarregando = true;
  state.adminErro = '';
  render();
  try {
    const { data, error } = await sbClient.rpc('admin_listar_usuarios');
    if (error) {
      state.adminErro = 'Não deu pra carregar: ' + error.message;
      state.adminUsuarios = [];
    } else {
      state.adminUsuarios = data;
    }
  } catch (e) {
    state.adminErro = 'Não deu pra carregar agora. Confere sua internet.';
  }
  state.adminCarregando = false;
  render();
}

async function renovarAssinatura(telefone, dias) {
  try {
    const { error } = await sbClient.rpc('admin_renovar_assinatura', { telefone_alvo: telefone, dias: dias });
    if (error) {
      showToast('Não deu pra renovar: ' + error.message);
      return;
    }
    // Recarrega a lista inteira, já que o bônus pode ter sido creditado
    // pra OUTRA pessoa também (quem indicou), não só quem recebeu os dias
    await carregarPainelAdmin();
    showToast(`Adicionado! +${dias} dias pra essa pessoa.`);
  } catch (e) {
    showToast('Não deu pra renovar agora. Confere sua internet.');
  }
}

function corDoNivel(nivel) {
  if (nivel === 'Diamante') return '#8FD3FF';
  if (nivel === 'Ouro') return 'var(--gold)';
  if (nivel === 'Prata') return '#B8C0D0';
  return '#C98A5A'; // Bronze
}

function diasRestantesDe(usuario) {
  const criado = new Date(usuario.criado_em);
  const totalDias = (usuario.plano_dias_base || 30) + (usuario.plano_dias_bonus || 0);
  const vencimento = new Date(criado);
  vencimento.setDate(vencimento.getDate() + totalDias);
  return daysBetween(new Date(), vencimento);
}

  }

  if (state.adminCarregando) {
    box.appendChild(el('div', { class: 'empty' }, 'Carregando...'));
    return box;
  }

  const termo = state.adminBusca.trim().toLowerCase();
  const lista = state.adminUsuarios.filter(u =>
    !termo || u.nome.toLowerCase().includes(termo) || (u.telefone || '').includes(termo)
  );

  if (lista.length === 0) {
    box.appendChild(el('div', { class: 'empty' }, state.adminUsuarios.length === 0 ? 'Nenhum usuário cadastrado ainda.' : 'Ninguém encontrado com essa busca.'));
    return box;
  }

  lista.forEach(u => {
    const restam = diasRestantesDe(u);
    const ativo = restam >= 0;
    const card = el('div', { class: 'venda-card' });
    const top = el('div', { class: 'venda-top' });
    top.appendChild(el('div', { class: 'venda-cliente' }, u.nome));
    top.appendChild(el('div', { class: 'status-pill ' + (ativo ? 'status-pago' : 'status-atrasado') }, ativo ? `${restam} dias restantes` : `Vencido há ${Math.abs(restam)} dias`));
    card.appendChild(top);
    card.appendChild(el('div', { style: 'color:var(--ink-soft); font-size:13px; margin-top:2px;' }, u.telefone));

    const nivelRow = el('div', { style: 'display:flex; gap:6px; align-items:center; margin-top:6px;' });
    nivelRow.appendChild(el('div', { style: `font-size:11px; font-weight:600; border:1px solid ${corDoNivel(u.nivel)}; color:${corDoNivel(u.nivel)}; border-radius:6px; padding:2px 8px;` }, u.nivel || 'Bronze'));
    nivelRow.appendChild(el('div', { style: 'font-size:12px; color:var(--ink-soft);' }, `${u.indicacoes_pagas || 0} indicações pagas`));
    card.appendChild(nivelRow);

    const acaoRow = el('div', { style: 'display:flex; gap:8px; margin-top:12px;' });
    const diasInput = el('input', { type: 'number', placeholder: 'Dias', style: 'width:80px; padding:9px 10px; border-radius:8px; border:1.5px solid var(--line); background:var(--paper-raised); color:var(--ink); font-size:14px;' });
    const renovarBtn = el('button', { class: 'cobrar-btn', style: 'flex:1; margin:0;' }, 'Adicionar dias');
    renovarBtn.addEventListener('click', () => {
      const dias = parseInt(diasInput.value, 10);
      if (!dias || dias === 0) { showToast('Digita um número de dias válido.'); return; }
      renovarAssinatura(u.telefone, dias);
    });
    acaoRow.appendChild(diasInput);
    acaoRow.appendChild(renovarBtn);
    card.appendChild(acaoRow);

    box.appendChild(card);
  });

  return box;
}

function nivelDe(qtd) {
  if (qtd >= 10) return 'Diamante';
  if (qtd >= 5) return 'Ouro';
  if (qtd >= 2) return 'Prata';
  return 'Bronze';
}

function diasPorNivel(nivel) {
  if (nivel === 'Diamante') return 30;
  if (nivel === 'Ouro') return 25;
  if (nivel === 'Prata') return 20;
  return 15;
}

function proximoNivelInfo(qtd) {
  if (qtd < 2) return { faltam: 2 - qtd, nivel: 'Prata' };
  if (qtd < 5) return { faltam: 5 - qtd, nivel: 'Ouro' };
  if (qtd < 10) return { faltam: 10 - qtd, nivel: 'Diamante' };
  return null; // já no topo
}

const MP_PLAN_CHECKOUT_URL = 'https://www.mercadopago.com.br/subscriptions/checkout?preapproval_plan_id=fb14a710e33b4889920e169a01f952c1';

function iniciarAssinatura() {
  // Guarda o telefone de quem tá assinando, pra reconhecer quando a pessoa
  // voltar do Mercado Pago (mesmo que a sessão do navegador seja reaberta)
  localStorage.setItem('ganho_assinando_telefone', state.user.telefone);
  window.location.href = MP_PLAN_CHECKOUT_URL;
}

async function vincularAssinaturaMP(preapprovalId, telefone) {
  try {
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/mp-criar-assinatura`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ telefone, preapproval_id: preapprovalId })
    });
    const data = await resp.json();
    if (resp.ok && !data.error) {
      showToast('Assinatura vinculada! O pagamento pode levar alguns instantes pra confirmar.');
    } else {
      showToast('Não deu pra vincular a assinatura: ' + (data.error || 'erro desconhecido'));
    }
  } catch (e) {
    showToast('Não deu pra confirmar a assinatura agora. Fala com o suporte se persistir.');
  }
  localStorage.removeItem('ganho_assinando_telefone');
  const url = new URL(window.location.href);
  url.searchParams.delete('preapproval_id');
  window.history.replaceState({}, '', url.toString());
}

function FinanceiroTab() {
  const box = el('div');

  let totalRecebido = 0;
  state.vendas.forEach(v => v.parcelas.forEach(p => { if (parcelaStatusReal(p) === 'pago') totalRecebido += p.valor; }));
  const totalDespesas = state.despesas.reduce((s, d) => s + d.valor, 0);
  const saldo = totalRecebido - totalDespesas;

  const saldoCard = el('div', { class: 'plan-card', style: saldo < 0 ? 'background:var(--red);' : '' });
  saldoCard.appendChild(el('div', { class: 'label' }, 'Saldo (recebido − gastos)'));
  saldoCard.appendChild(el('div', { class: 'days mono' }, fmtMoney(saldo)));
  box.appendChild(saldoCard);

  const summary = el('div', { class: 'summary-row', style: 'margin-top:14px;' });
  const b1 = el('div', { class: 'summary-box' });
  b1.appendChild(el('div', { class: 'n mono' }, fmtMoney(totalRecebido)));
  b1.appendChild(el('div', { class: 'l' }, 'Entradas (recebido)'));
  const b2 = el('div', { class: 'summary-box' });
  b2.appendChild(el('div', { class: 'n mono', style: 'color:var(--red)' }, fmtMoney(totalDespesas)));
  b2.appendChild(el('div', { class: 'l' }, 'Saídas (gastos)'));
  summary.appendChild(b1); summary.appendChild(b2);
  box.appendChild(summary);

  // Resumo do mês atual (tipo DRE simplificado)
  const hoje = new Date();
  const mesAtual = hoje.getMonth(), anoAtual = hoje.getFullYear();
  let vendidoMes = 0, recebidoMes = 0, despesasMes = 0;
  state.vendas.forEach(v => {
    const d = new Date(v.criado_em);
    if (d.getMonth() === mesAtual && d.getFullYear() === anoAtual) vendidoMes += v.valor_total;
    v.parcelas.forEach(p => {
      if (parcelaStatusReal(p) === 'pago') {
        const dp = new Date(p.vencimento);
        if (dp.getMonth() === mesAtual && dp.getFullYear() === anoAtual) recebidoMes += p.valor;
      }
    });
  });
  state.despesas.forEach(d => {
    const dd = new Date(d.criado_em);
    if (dd.getMonth() === mesAtual && dd.getFullYear() === anoAtual) despesasMes += d.valor;
  });
  const lucroMes = recebidoMes - despesasMes;
  const nomeMes = hoje.toLocaleDateString('pt-BR', { month: 'long' });

  box.appendChild(el('h3', { style: 'font-size:15px; margin:18px 0 10px; text-transform:capitalize;' }, `Resumo de ${nomeMes}`));
  const dreCard = el('div', { class: 'venda-card' });
  const dreRow = (label, valor, destaque) => {
    const r = el('div', { style: 'display:flex; justify-content:space-between; padding:6px 0;' + (destaque ? ' border-top:1.5px solid var(--line); margin-top:4px; padding-top:10px; font-weight:600;' : '') });
    r.appendChild(el('div', { style: 'font-size:13.5px;' + (destaque ? '' : ' color:var(--ink-soft);') }, label));
    r.appendChild(el('div', { class: 'mono', style: 'font-size:13.5px;' + (destaque ? (lucroMes < 0 ? ' color:var(--red);' : ' color:var(--green-deep);') : '') }, valor));
    return r;
  };
  dreCard.appendChild(dreRow('Vendido no mês', fmtMoney(vendidoMes)));
  dreCard.appendChild(dreRow('Recebido no mês', fmtMoney(recebidoMes)));
  dreCard.appendChild(dreRow('Gastos no mês', '- ' + fmtMoney(despesasMes)));
  dreCard.appendChild(dreRow('Lucro do mês', fmtMoney(lucroMes), true));
  box.appendChild(dreCard);

  // Projeção de recebimentos futuros
  const hojeMid = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  const calcProjecao = (dias) => {
    let total = 0;
    const limite = new Date(hojeMid);
    limite.setDate(limite.getDate() + dias);
    state.vendas.forEach(v => v.parcelas.forEach(p => {
      if (parcelaStatusReal(p) === 'pago') return;
      const venc = new Date(p.vencimento);
      if (venc >= hojeMid && venc <= limite) total += p.valor;
    }));
    return total;
  };
  box.appendChild(el('h3', { style: 'font-size:15px; margin:18px 0 10px;' }, 'Previsão de recebimentos'));
  const projRow = el('div', { class: 'summary-row' });
  [[30, 'Em 30 dias'], [60, 'Em 60 dias'], [90, 'Em 90 dias']].forEach(([dias, label]) => {
    const pbox = el('div', { class: 'summary-box' });
    pbox.appendChild(el('div', { class: 'n mono' }, fmtMoney(calcProjecao(dias))));
    pbox.appendChild(el('div', { class: 'l' }, label));
    projRow.appendChild(pbox);
  });

async function handleEditarVenda(vendaId) {
  const venda = state.vendas.find(v => v.id === vendaId);
  if (!venda) return;

  const cliente = state.editVendaForm.cliente.trim();
  if (!cliente) { state.editVendaErr = 'Preenche o nome do cliente.'; render(); return; }

  const temPagamento = venda.parcelas.some(p => p.status === 'pago');

  venda.cliente = cliente;
  venda.descricao = state.editVendaForm.descricao.trim();
  venda.categoria = state.editVendaForm.categoria || 'Venda';
  venda.whatsapp = normPhone(state.editVendaForm.whatsapp || '');

  if (!temPagamento) {
    const valor = parseFloat(state.editVendaForm.valor.replace(',', '.'));
    if (!valor || valor <= 0) { state.editVendaErr = 'Preenche um valor válido, ex: 500,00.'; render(); return; }
    const dataVendaStr = state.editVendaForm.dataVenda || todayISO();
    const dataVenda = new Date(dataVendaStr + 'T12:00:00');
    const parcelas = gerarParcelas(valor, state.editVendaForm.parcelas, dataVenda);
    venda.valor_total = valor;
    venda.criado_em = dataVenda.toISOString();
    venda.parcelas = parcelas;
  }

  await updateVenda(venda);
  state.showEditarVenda = false;
  state.editVendaErr = '';
  render();
}

async function handleExcluirVenda(vendaId) {
  state.vendas = state.vendas.filter(v => v.id !== vendaId);
  await deleteVendaDB(vendaId);
  state.confirmExcluirVenda = false;
  state.vendaDetalheId = null;
  render();
}

(async function init() {
  try {
    const { data: { session } } = await sbClient.auth.getSession();
    if (session && session.user) {
      const { data: perfil, error: perfilError } = await sbClient.from('usuarios').select('*').eq('user_id', session.user.id).single();
      if (!perfilError && perfil) {
        state.user = perfil;
        state.vendas = await loadVendas(session.user.id);
        state.despesas = await loadDespesas(session.user.id);
        state.referrals = await loadReferrals(session.user.id);
        state.screen = 'app';
        state.tab = 'vendas';

        // Se a pessoa acabou de voltar do checkout do Mercado Pago, vincula
        // a assinatura automaticamente
        const params = new URLSearchParams(window.location.search);
        const preapprovalId = params.get('preapproval_id');
        const telefonePendente = localStorage.getItem('ganho_assinando_telefone');
        if (preapprovalId && telefonePendente) {
          vincularAssinaturaMP(preapprovalId, telefonePendente);
        }

        render();
        return;
      }
    }
  } catch (e) {
    // se der qualquer erro checando a sessão, cai pro fluxo normal de login
  }
  render();
})();
